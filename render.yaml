services:
  - type: web
    name: mindia-api
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindia-db
          property: connectionString
      - key: FRONTEND_BASE_URL
        fromService:
          type: web
          name: mindia-web
          property: host
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_DEMO_MODE
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: ARPQI_OWNER_EMAIL
        sync: false
      - key: ARPQI_OWNER_PHONE
        sync: false

  - type: static
    name: mindia-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mindia-api
          property: host

databases:
  - name: mindia-db
    plan: basic-256mb
    databaseName: mindia
    user: mindia
