[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mindia-backend"
version = "0.1.0"
description = "Backend do MVP MindIA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159,<1.0",
    "email-validator>=2.2,<3.0",
    "cryptography>=45,<47",
    "itsdangerous>=2.2,<3.0",
    "openai>=1.68,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.1,<3.0",
    "qrcode[pil]>=8.2,<9.0",
    "uvicorn>=0.54,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<3.0",
    "pytest>=9.1,<10.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
